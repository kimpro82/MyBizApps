<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ImageMerger - Stacking & Grid Canvas Tool</title>
    <meta name="description" content="Merge, grid, and layout multiple images into a single file directly in your browser with canvas rendering." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- App Header -->
      <header class="app-header">
        <div class="brand">
          <div class="brand-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          </div>
          <div>
            <h1 class="brand-title">ImageMerger</h1>
            <p class="brand-subtitle">Instant Client-side Image Grid & Stitcher</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="btn-clear-all" class="btn btn-ghost danger" title="Remove all uploaded images">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            Clear All
          </button>
          <button id="btn-copy-clipboard" class="btn btn-secondary" title="Copy canvas image to clipboard">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            Copy Image
          </button>
          <button id="btn-download-top" class="btn btn-primary" title="Download merged image">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            Download Image
          </button>
        </div>
      </header>

      <!-- Main Workspace -->
      <main class="workspace">
        <!-- Control Sidebar -->
        <aside class="sidebar">
          <!-- Section 1: Upload Zone -->
          <section class="panel upload-panel">
            <h2 class="panel-title">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
              Add Images
            </h2>
            <div id="drop-zone" class="drop-zone">
              <input type="file" id="file-input" multiple accept="image/png, image/jpeg, image/webp, image/gif, image/svg+xml, image/avif" class="file-input-hidden" />
              <div class="drop-zone-content">
                <div class="drop-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                </div>
                <p class="drop-title">Drag & Drop images here</p>
                <p class="drop-sub">or click to browse files</p>
                <div class="supported-formats">
                  <span class="format-tag">PNG</span>
                  <span class="format-tag">JPG</span>
                  <span class="format-tag">WebP</span>
                  <span class="format-tag">GIF</span>
                  <span class="format-tag">SVG</span>
                  <span class="format-tag">AVIF</span>
                </div>
              </div>
            </div>
          </section>

          <!-- Section 2: Layout & Canvas Controls -->
          <section class="panel layout-panel">
            <h2 class="panel-title">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
              Layout Configuration
            </h2>

            <div class="control-group">
              <label class="control-label">Layout Mode</label>
              <div class="segmented-control" id="layout-mode-group">
                <button type="button" class="segment-btn active" data-mode="auto" title="Auto Grid arrangement">
                  <span>Auto Grid</span>
                </button>
                <button type="button" class="segment-btn" data-mode="horizontal" title="Single horizontal row">
                  <span>Row</span>
                </button>
                <button type="button" class="segment-btn" data-mode="vertical" title="Single vertical column">
                  <span>Column</span>
                </button>
                <button type="button" class="segment-btn" data-mode="custom" title="Custom grid columns">
                  <span>Custom</span>
                </button>
              </div>
            </div>

            <!-- Custom columns (hidden unless custom mode selected) -->
            <div class="control-group" id="group-custom-cols" style="display: none;">
              <div class="control-header">
                <label for="input-cols" class="control-label">Grid Columns</label>
                <span class="control-value" id="val-cols">3</span>
              </div>
              <input type="range" id="input-cols" min="1" max="10" value="3" class="range-input" />
            </div>

            <!-- Spacing / Gap -->
            <div class="control-group">
              <div class="control-header">
                <label for="input-spacing" class="control-label">Image Spacing (Gap)</label>
                <span class="control-value" id="val-spacing">10 px</span>
              </div>
              <input type="range" id="input-spacing" min="0" max="100" value="10" class="range-input" />
            </div>

            <!-- Outer Padding -->
            <div class="control-group">
              <div class="control-header">
                <label for="input-padding" class="control-label">Outer Canvas Padding</label>
                <span class="control-value" id="val-padding">10 px</span>
              </div>
              <input type="range" id="input-padding" min="0" max="100" value="10" class="range-input" />
            </div>

            <!-- Background Color -->
            <div class="control-group">
              <label class="control-label">Background Color</label>
              <div class="color-picker-row">
                <button type="button" class="color-preset-btn active" data-color="transparent" title="Transparent background">
                  <span class="checkerboard-sample"></span>
                </button>
                <button type="button" class="color-preset-btn" data-color="#ffffff" title="White background">
                  <span class="color-sample" style="background-color: #ffffff;"></span>
                </button>
                <button type="button" class="color-preset-btn" data-color="#000000" title="Black background">
                  <span class="color-sample" style="background-color: #000000;"></span>
                </button>
                <button type="button" class="color-preset-btn" data-color="#f3f4f6" title="Light Gray background">
                  <span class="color-sample" style="background-color: #f3f4f6;"></span>
                </button>
                <div class="color-custom-wrapper">
                  <input type="color" id="input-bg-color" value="#ffffff" title="Pick custom color" />
                </div>
              </div>
            </div>
          </section>

          <!-- Section 3: Export Configuration -->
          <section class="panel export-panel">
            <h2 class="panel-title">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
              Export Options
            </h2>

            <div class="control-group">
              <label for="select-format" class="control-label">Image Format</label>
              <select id="select-format" class="select-input">
                <option value="image/png">PNG (Lossless & Transparent)</option>
                <option value="image/jpeg">JPEG (Compressed)</option>
                <option value="image/webp">WebP (Modern High Efficiency)</option>
              </select>
            </div>

            <div class="control-group" id="group-quality" style="display: none;">
              <div class="control-header">
                <label for="input-quality" class="control-label">Export Quality</label>
                <span class="control-value" id="val-quality">92%</span>
              </div>
              <input type="range" id="input-quality" min="10" max="100" value="92" class="range-input" />
            </div>

            <div class="control-group">
              <label for="input-filename" class="control-label">Filename</label>
              <input type="text" id="input-filename" value="merged-image" class="text-input" placeholder="e.g. merged-image" />
            </div>

            <button id="btn-download-side" class="btn btn-primary btn-full">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
              Download Merged Image
            </button>
          </section>

          <!-- Section 4: Individual Image Management -->
          <section class="panel items-panel">
            <div class="panel-header-with-count">
              <h2 class="panel-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                Uploaded Images
              </h2>
              <span id="items-count-badge" class="count-badge">0 items</span>
            </div>

            <div id="items-list" class="items-list">
              <!-- Dynamically populated image cards -->
              <div class="empty-list-message">
                <p>No images added yet.</p>
              </div>
            </div>
          </section>
        </aside>

        <!-- Preview Canvas Area -->
        <section class="preview-area">
          <div class="preview-toolbar">
            <div class="canvas-info">
              <span class="info-tag" id="canvas-size-tag">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                <span id="val-dimensions">0 x 0 px</span>
              </span>
              <span class="info-tag" id="canvas-aspect-tag">
                <span id="val-aspect">0:0</span>
              </span>
            </div>
            
            <div class="zoom-controls">
              <button type="button" id="btn-zoom-out" class="icon-btn" title="Zoom out">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
              </button>
              <span id="val-zoom" class="zoom-text">Fit</span>
              <button type="button" id="btn-zoom-in" class="icon-btn" title="Zoom in">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
              </button>
              <button type="button" id="btn-zoom-fit" class="btn btn-ghost btn-xs" title="Reset zoom to fit screen">Fit Screen</button>
            </div>
          </div>

          <div id="canvas-viewport" class="canvas-viewport">
            <div class="canvas-wrapper">
              <canvas id="output-canvas"></canvas>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
