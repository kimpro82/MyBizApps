name: Deploy ImageMerger to GitHub Pages

on:
  push:
    branches:
      - tsImageMerger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web/ImageMerger
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/ImageMerger/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build ImageMerger
        run: npm run build

      - name: Prepare Pages artifact
        working-directory: .
        run: |
          rm -rf _site
          mkdir -p _site/Web/ImageMerger
          cp index.html _site/index.html
          cp -R Web/ImageMerger/dist _site/Web/ImageMerger/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
